name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Тесты
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Сборка Pyatimirye.exe
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/Pyatimirye.exe ./cmd/pyatimirye
      - uses: actions/upload-artifact@v4
        with:
          name: Pyatimirye-windows
          path: dist/Pyatimirye.exe
