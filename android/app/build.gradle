plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brokendoto.pyatimirye'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brokendoto.pyatimirye'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '0.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Библиотека с игрой, которую собирает ebitenmobile (см. README).
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
